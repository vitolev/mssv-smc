  phi_a: 6
  phi_b: 2
  eta2_a: 2.001
  eta2_b: 0.1
  diff_mean: 0.0
  diff_sd: 10.0
  P_diag: 2.9
  P_base: 0.1

proposal:              
  mode: "conditional"      
  